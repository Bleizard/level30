<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>LEVEL 30</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --ui: 'Press Start 2P', ui-monospace, Menlo, monospace; --gold:#ffd23f; --red:#e8412c; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; background:#0d0b1a; color:#fff; font-family:var(--ui);
    overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #stage { position:relative; width:min(100vw, calc(100vh * 16 / 9)); aspect-ratio:16/9;
    container-type:size; overflow:hidden; box-shadow:0 0 0 2px #000, 0 20px 60px #0008; }
  canvas { width:100%; height:100%; display:block; image-rendering:pixelated; image-rendering:crisp-edges; }
  [hidden] { display:none !important; }

  /* NPC name labels (positioned by game.js in % of the 320×180 canvas) */
  #labels { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  #labels .lbl { position:absolute; transform:translate(-50%, -100%); white-space:nowrap; font-family:var(--ui);
    font-size:1.1cqw; line-height:1; color:#fff; padding-bottom:0.1cqw;
    text-shadow:0.15cqw 0 0 #000, -0.15cqw 0 0 #000, 0 0.15cqw 0 #000, 0 -0.15cqw 0 #000, 0.15cqw 0.15cqw 0 #000; }

  /* HUD */
  #hud { position:absolute; top:2.5cqh; left:2.5cqw; right:2.5cqw; display:flex; justify-content:space-between;
    align-items:flex-start; gap:2cqw; pointer-events:none; }
  #quest { background:#0009; border:0.3cqw solid #fff; padding:1cqw 1.4cqw; font-size:1.4cqw; line-height:1.7; }
  #quest .h { color:var(--gold); font-size:1.1cqw; margin-bottom:0.4cqw; }
  #quest.done { border-color:var(--gold); }
  #hudL { flex:0 0 40cqw; }
  #hudC { text-align:right; flex:1; font-size:1.5cqw; line-height:1.7; text-shadow:0.25cqw 0.25cqw 0 #000; padding-top:0.6cqw; }
  #party { font-size:1.2cqw; margin-top:1cqw; text-shadow:0.2cqw 0.2cqw 0 #000; line-height:1.6; }
  #mute { pointer-events:auto; background:#0006; border:0.3cqw solid #fff; color:#fff; font:inherit;
    font-size:1.6cqw; padding:0.6cqw 0.8cqw; cursor:pointer; }

  #banner { position:absolute; top:22cqh; left:50%; transform:translateX(-50%); text-align:center;
    background:#000a; padding:1.6cqw 2.4cqw; border:0.4cqw solid #fff; box-shadow:0.6cqw 0.6cqw 0 #0008;
    pointer-events:none; opacity:0; transition:opacity .4s, transform .4s; width:max-content; max-width:84cqw; }
  #banner.show { opacity:1; transform:translateX(-50%) translateY(-1cqh); }
  #banner .y { font-size:3cqw; color:var(--gold); }
  #banner .t { font-size:2.2cqw; margin-top:1.2cqw; }
  #banner .i { font-size:1.3cqw; margin-top:1.2cqw; opacity:.8; }

  #toast { position:absolute; bottom:22cqh; left:50%; transform:translateX(-50%); font-size:1.6cqw;
    background:#000c; border:0.3cqw solid var(--gold); padding:1cqw 1.6cqw; pointer-events:none;
    width:max-content; max-width:80cqw; text-align:center; line-height:1.6;
    opacity:0; transition:opacity .3s; }
  #toast.show { opacity:1; }

  #center { position:absolute; top:28cqh; left:0; right:0; text-align:center; font-size:7cqw;
    color:#fff; text-shadow:0.5cqw 0.5cqw 0 #000; pointer-events:none; }
  #hint { position:absolute; bottom:4cqh; left:0; right:0; text-align:center; font-size:1.6cqw;
    text-shadow:0.2cqw 0.2cqw 0 #000; pointer-events:none; animation:blink 1.2s steps(2) infinite; }

  #dialog { position:absolute; left:4cqw; right:4cqw; bottom:4cqh; background:#1b1530ee;
    border:0.5cqw solid #fff; box-shadow:0 0 0 0.5cqw #000, 0.8cqw 0.8cqw 0 0.5cqw #0008;
    padding:2.2cqw 2.6cqw; display:flex; gap:2.4cqw; align-items:center; cursor:pointer; }
  #dialog img { max-height:42cqh; max-width:34cqw; border:0.4cqw solid #fff; image-rendering:auto; }
  #dlgWho { position:absolute; top:-2.4cqw; left:2cqw; background:var(--gold); color:#000; font-size:1.4cqw; padding:0.6cqw 1cqw; }
  #dlgText { font-size:2cqw; line-height:1.9; flex:1; min-height:8cqh; }
  #dlgMore { position:absolute; right:1.6cqw; bottom:1cqw; font-size:1.6cqw; animation:blink .8s steps(2) infinite; }

  .ov { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  #title { background:linear-gradient(#0d0b1aaa, #0d0b1a33 60%, #0d0b1acc); }
  .logo { font-size:9cqw; line-height:1; color:#fff; text-shadow:0.6cqw 0.6cqw 0 var(--red), 1.2cqw 1.2cqw 0 #000; }
  .logo b { color:var(--gold); font-weight:normal; display:inline-block; animation:bob 1s ease-in-out infinite; }
  .sub { font-size:2cqw; margin-top:3cqh; text-shadow:0.3cqw 0.3cqw 0 #000; }
  button.big { font-family:var(--ui); font-size:2.6cqw; margin-top:6cqh; padding:1.8cqw 3cqw; color:#000;
    background:var(--gold); border:0; box-shadow:0 0 0 0.5cqw #000, 0.8cqw 0.8cqw 0 0.5cqw #000; cursor:pointer;
    animation:blink 1.2s steps(2) infinite; }
  .help { font-size:1.4cqw; line-height:2; margin-top:5cqh; opacity:.85; text-shadow:0.2cqw 0.2cqw 0 #000; }

  #tbc { background:radial-gradient(ellipse at center, #0d0b1a99 20%, #0d0b1aee); padding:4cqw; }
  #tbc .logo { font-size:5.5cqw; line-height:1.3; }
  #tbc .sub { max-width:70cqw; line-height:1.9; }
  #reveal { background:radial-gradient(ellipse at center, #0000 30%, #0008); padding:2cqw; }
  #reveal .hello { font-size:3cqw; color:var(--gold); text-shadow:0.4cqw 0.4cqw 0 #000; margin-bottom:2.5cqh;
    animation:pop .6s cubic-bezier(.2,1.6,.4,1) both; }
  .ticket { display:flex; width:74cqw; background:#fffaf0; color:#1b1530; box-shadow:0 0 0 0.5cqw #000, 1.2cqw 1.2cqw 0 0.5cqw #0009;
    animation:pop .8s .25s cubic-bezier(.2,1.6,.4,1) both; text-align:left; }
  .t-main { flex:1; padding:2cqw 2.6cqw; border-right:0.5cqw dashed #1b1530; }
  .t-head { font-size:1.4cqw; color:var(--red); letter-spacing:.1em; }
  .t-title { font-size:3cqw; margin-top:1.4cqw; line-height:1.2; }
  .t-title::before { content:""; display:inline-block; width:3cqw; height:3cqw; margin-right:1.4cqw; vertical-align:-0.3cqw;
    background:conic-gradient(#000 25%, #fff 0 50%, #000 0 75%, #fff 0); background-size:1.5cqw 1.5cqw; border:0.25cqw solid #000; }
  .t-sub { font-size:1.4cqw; margin-top:1.4cqw; opacity:.75; line-height:1.6; }
  .t-rows { margin-top:1.8cqw; display:grid; grid-template-columns:auto 1fr; gap:1cqw 2cqw; font-size:1.45cqw; line-height:1.4; }
  .t-rows .k { opacity:.55; }
  .t-stub { width:15cqw; display:flex; align-items:center; justify-content:center; background:var(--red); color:#fff; }
  .t-stub div { transform:rotate(-90deg); font-size:2.6cqw; white-space:nowrap; }
  #reveal .note { font-size:1.35cqw; line-height:1.9; margin-top:3cqh; max-width:70cqw; text-shadow:0.2cqw 0.2cqw 0 #000; animation:pop .6s 1.2s both; }
  #again { font-family:var(--ui); font-size:1.2cqw; margin-top:2cqh; background:none; color:#fff; border:0.3cqw solid #fff;
    padding:1cqw 1.6cqw; cursor:pointer; opacity:.7; animation:pop .6s 1.8s both; }

  /* touch: virtual stick (left half) + action button */
  #touch { position:fixed; inset:0; pointer-events:none; }
  #stickZone { position:absolute; left:0; bottom:0; width:50%; height:60%; pointer-events:auto; touch-action:none; }
  #stick { position:absolute; width:26vmin; height:26vmin; max-width:150px; max-height:150px; border-radius:50%;
    border:3px solid #fff6; background:#ffffff14; transform:translate(-50%,-50%); pointer-events:none; }
  #knob { position:absolute; left:50%; top:50%; width:44%; height:44%; border-radius:50%; background:#ffffff55;
    transform:translate(-50%,-50%); }
  #actBtn { position:absolute; right:6vmin; bottom:calc(8vmin + env(safe-area-inset-bottom)); width:18vmin; height:18vmin;
    max-width:100px; max-height:100px; border-radius:50%; border:3px solid #fff8; background:#ffd23f44; color:#fff;
    font-family:var(--ui); font-size:5vmin; pointer-events:auto; touch-action:none; }
  #actBtn.on { background:#ffd23faa; }
  @media (pointer:fine) { #touch { display:none; } }
  #rotate { position:fixed; top:calc(10px + env(safe-area-inset-top)); left:0; right:0; text-align:center; font-size:11px; opacity:.7; pointer-events:none; }
  @media (orientation:landscape), (pointer:fine) { #rotate { display:none; } }

  @keyframes blink { 50% { opacity:.35; } }
  @keyframes bob { 50% { transform:translateY(-0.8cqw); } }
  @keyframes pop { from { opacity:0; transform:scale(.6); } }
  /* menu (Esc): fixed overlay above touch controls */
  #menu { position:fixed; inset:0; z-index:40; background:#000a; display:flex; align-items:center; justify-content:center; padding:12px; font-family:var(--ui); }
  #menu .mbox { width:min(560px, 100%); max-height:100%; overflow:auto; touch-action:pan-y; background:#1b1530; border:3px solid #fff;
    box-shadow:6px 6px 0 #000; padding:16px; display:flex; flex-direction:column; gap:7px; font-size:clamp(9px, 1.25vw, 12px); }
  #menu .mh { color:var(--gold); font-size:1.4em; margin-bottom:6px; }
  #menu .mh2 { color:var(--gold); margin:10px 0 2px; }
  #menu button { font:inherit; text-align:left; color:#fff; background:#2f2842; border:2px solid #fff3; padding:9px 10px; cursor:pointer; line-height:1.5; }
  #menu button:hover { border-color:var(--gold); }
  #menu button.cur { border-color:var(--gold); }
  #menu .mch span { opacity:.55; float:right; }
  #menu .msc { display:flex; flex-direction:column; gap:5px; margin:0 0 6px 18px; }
  #menu .msc button { background:#231d33; font-size:.92em; }
  #menu .locked { opacity:.35; padding:6px 10px; }
  #menu .mfoot { opacity:.5; font-size:.85em; margin-top:8px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game" width="320" height="180"></canvas>
    <div id="labels"></div>

    <div id="hud" hidden>
      <div id="hudL"><div id="quest"><div class="h">ЗАДАНИЕ</div><div id="questText"></div></div><div id="party"></div></div>
      <div id="hudC"></div>
      <button id="mute" title="Меню (Esc)">МЕНЮ</button>
    </div>
    <div id="banner"><div class="y"></div><div class="t"></div><div class="i"></div></div>
    <div id="toast"></div>
    <div id="center"></div>
    <div id="hint" hidden></div>

    <div id="dialog" hidden><div id="dlgWho" hidden></div><img id="dlgImg" alt="" hidden><div id="dlgText"></div><div id="dlgMore">▼</div></div>

    <div id="title" class="ov">
      <div class="logo" id="tLogo"></div>
      <div class="sub" id="tSub"></div>
      <button class="big" id="startBtn">▶ СТАРТ</button>
      <div class="help">WASD / стрелки — ходить · E / ПРОБЕЛ — говорить<br>выполняй задания · ищи воспоминания «?»</div>
    </div>

    <div id="tbc" class="ov" hidden>
      <div class="logo" id="tbcTitle"></div>
      <div class="sub" id="tbcText"></div>
      <button class="big" id="tbcAgain">ЕЩЁ РАЗ</button>
    </div>

    <div id="reveal" class="ov" hidden>
      <div class="hello" id="gHello"></div>
      <div class="ticket">
        <div class="t-main">
          <div class="t-head" id="gHead"></div>
          <div class="t-title" id="gTitle"></div>
          <div class="t-sub" id="gSub"></div>
          <div class="t-rows" id="gRows"></div>
        </div>
        <div class="t-stub"><div id="gStub"></div></div>
      </div>
      <div class="note" id="gNote"></div>
      <button id="again">ещё раз</button>
    </div>
  </div>
</div>
<div id="rotate">↻ поверни телефон — так удобнее</div>
<div id="touch">
  <div id="stickZone"></div>
  <div id="stick" hidden><div id="knob"></div></div>
  <button id="actBtn">E</button>
</div>

<script>window.L30_PUBLIC = true; window.L30_ED = "teaser";</script>
<script src="story.js?v=mvo9eu7l"></script>
<script src="registry.js?v=mvo9eu7l"></script>
<script src="sprites.js?v=mvo9eu7l"></script>
<script src="objects.js?v=mvo9eu7l"></script>
<script src="chapters/ch1.js?v=mvo9eu7l"></script>
<script src="game.js?v=mvo9eu7l"></script>
</body>
</html>
